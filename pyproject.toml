[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "Redkite"
version = "0.1.0"
description = "Python package for Redkite."
readme = "README.md"
requires-python = ">=3.9"
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "InteralDigital" },
]
maintainers = [
  { name = "InteralDigital" },
]
keywords = ["redkite"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Intera-Digital/redkite-python"
Repository = "https://github.com/Intera-Digital/redkite-python"
Issues = "https://github.com/Intera-Digital/redkite-python/issues"

[project.optional-dependencies]
dev = [
  "build",
  "twine",
]
